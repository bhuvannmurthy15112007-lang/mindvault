<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <defs>
    <pattern id="graphGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Paper Sheet with aged border -->
  <rect x="5" y="5" width="690" height="510" rx="6" fill="url(#paperBg)" stroke="#334155" stroke-width="2" />
  <rect x="15" y="15" width="670" height="490" fill="url(#graphGrid)" />

  <!-- Burned corner / grunge effect -->
  <path d="M 685,5 L 630,5 Q 650,25 660,60 L 685,60 Z" fill="#451a03" opacity="0.6"/>

  <!-- Journal Header -->
  <text x="35" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="2">
    CHIEF ENGINEER LOGBOOK • ENTRY 104-E
  </text>
  <text x="35" y="65" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">
    SECTOR 02: REACTOR COOLANT HARMONIC MODULATION ARRAY
  </text>
  <line x1="35" y1="75" x2="665" y2="75" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Technical Note in Script Font -->
  <text x="35" y="105" fill="#f8fafc" font-family="monospace" font-size="12" font-style="italic">
    "Coolant pumps must be synchronized to the harmonic amplitude peaks of the primary channels."
  </text>
  <text x="35" y="125" fill="#f8fafc" font-family="monospace" font-size="12" font-style="italic">
    "Warning: Sensor B is reporting a grounding loop fault. Disregard Channel B telemetry."
  </text>

  <!-- Waveform Display Box -->
  <rect x="35" y="145" width="630" height="200" fill="#030712" stroke="#1e293b" rx="4" />

  <!-- Grid lines inside oscilloscope box -->
  <line x1="35" y1="195" x2="665" y2="195" stroke="#0f172a" stroke-width="1" />
  <line x1="35" y1="245" x2="665" y2="245" stroke="#0f172a" stroke-width="1" />
  <line x1="35" y1="295" x2="665" y2="295" stroke="#0f172a" stroke-width="1" />

  <!-- Channel A (Peak: 5) -->
  <g transform="translate(50, 160)">
    <text x="10" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CHANNEL A</text>
    <path d="M 0,110 Q 30,10 60,110 T 120,110" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="30" cy="10" r="4" fill="#38bdf8" />
    <text x="30" y="3" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">PEAK: 5</text>
  </g>

  <!-- Channel B (FAULT - Strikethrough) -->
  <g transform="translate(170, 160)">
    <text x="10" y="20" fill="#64748b" font-family="monospace" font-size="12" text-decoration="line-through">CHANNEL B</text>
    <path d="M 0,110 Q 30,90 60,110 T 120,110" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4" />
    <text x="20" y="60" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">[FAULT]</text>
    <line x1="5" y1="15" x2="80" y2="15" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Channel C (Peak: 8) -->
  <g transform="translate(290, 160)">
    <text x="10" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CHANNEL C</text>
    <path d="M 0,110 Q 30,-20 60,110 T 120,110" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="30" cy="-20" r="4" fill="#38bdf8" />
    <text x="30" y="-27" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">PEAK: 8</text>
  </g>

  <!-- Channel D (Peak: 3) -->
  <g transform="translate(410, 160)">
    <text x="10" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CHANNEL D</text>
    <path d="M 0,110 Q 30,50 60,110 T 120,110" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="30" cy="50" r="4" fill="#38bdf8" />
    <text x="30" y="42" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">PEAK: 3</text>
  </g>

  <!-- Channel E (Peak: 9) -->
  <g transform="translate(530, 160)">
    <text x="10" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CHANNEL E</text>
    <path d="M 0,110 Q 30,-35 60,110 T 120,110" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="30" cy="-35" r="4" fill="#38bdf8" />
    <text x="30" y="-42" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">PEAK: 9</text>
  </g>

  <!-- Cable Patch Routing Schematic (Hand-drawn look) -->
  <rect x="35" y="365" width="630" height="95" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="4" />
  <text x="50" y="390" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">
    PUMP STABILIZATION PATCH CONNECTION DIAGRAM:
  </text>
  <text x="50" y="415" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="6">
    [ CH-A ] ────► [ CH-D ] ────► [ CH-C ] ────► [ CH-E ]
  </text>
  <text x="50" y="442" fill="#94a3b8" font-family="monospace" font-size="10">
    *MODULATION CODE: Input the peak amplitudes in order of patch connections.
  </text>

  <!-- Engineering Stamp -->
  <g transform="translate(520, 400) rotate(-6)">
    <rect x="0" y="0" width="125" height="42" fill="none" stroke="#e11d48" stroke-width="2" rx="4" opacity="0.85" />
    <text x="62" y="18" fill="#e11d48" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CORE APPROVED</text>
    <text x="62" y="32" fill="#e11d48" font-family="monospace" font-size="8" text-anchor="middle">REF: ENG-992-B</text>
  </g>
</svg>
